name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clean page passes strict limits
        uses: ./
        with:
          path: test/fixtures/clean
          max-score: "0"
          max-issues: "0"
      - name: Sloppy page fails
        id: sloppy
        uses: ./
        continue-on-error: true
        with:
          path: test/fixtures/sloppy
          max-score: "50"
      - name: The Action failed the sloppy page and reported its score
        env:
          OUTCOME: ${{ steps.sloppy.outcome }}
          SCORE: ${{ steps.sloppy.outputs.score }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "expected failure, got $OUTCOME"; exit 1; }
          [ "$SCORE" -gt 50 ] || { echo "expected score > 50, got $SCORE"; exit 1; }
